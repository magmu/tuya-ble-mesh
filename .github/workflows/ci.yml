name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so new advisories (pip-audit) surface without a PR
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full suite: lib, HA layer, security and integration tests. HA is stubbed in
  # tests/stubs, so this runs without a Home Assistant instance.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Unit, security and integration tests
        run: pytest tests/unit tests/security tests/integration -q

  # Security scanners from scripts/run-checks.sh: bandit (risky code patterns),
  # pip-audit (known vulnerabilities in runtime requirements) and detect-secrets.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.10.1 detect-secrets==1.5.0

      - name: bandit
        run: bandit -r custom_components/tuya_ble_mesh -c pyproject.toml -q

      - name: pip-audit (manifest requirements)
        run: |
          python -c "import json; print('\n'.join(json.load(open('custom_components/tuya_ble_mesh/manifest.json'))['requirements']))" > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt

      - name: detect-secrets
        run: |
          detect-secrets scan \
            --exclude-files '(\.git/.*|strings\.json|translations/.*\.json|tests/.*\.py|\.github/.*\.sh)' \
            . > /tmp/secrets.json
          python - <<'PY'
          import json
          results = {k: v for k, v in json.load(open("/tmp/secrets.json"))["results"].items() if v}
          for path, found in results.items():
              for item in found:
                  print(f"{path}:{item['line_number']} {item['type']}")
          raise SystemExit(1 if results else 0)
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements_test.txt)"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: mypy (lib)
        run: mypy custom_components/tuya_ble_mesh/lib/tuya_ble_mesh

      - name: mypy (integration)
        run: mypy custom_components/tuya_ble_mesh

  # Icon regression check (PLAT-692)
  icon-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for icon regression
        run: .github/scripts/check-icon-regression.sh

  # Home Assistant's own manifest, translations and config-flow validator
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master

  # HACS packaging checks. brands: custom integrations aren't in the brands repo;
  # topics: not used on this fork.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics
