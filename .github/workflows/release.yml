name: Release

# Publishes a GitHub release (which HACS offers as an update) whenever a merge
# to main changes the integration version in manifest.json.

on:
  push:
    branches: [main]
    paths:
      - custom_components/tuya_ble_mesh/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/tuya_ble_mesh/manifest.json'))['version'])")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
